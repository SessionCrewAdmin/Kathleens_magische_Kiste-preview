<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9fc"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="../../manifest.webmanifest"><link rel="apple-touch-icon" href="../../assets/icons/app-180.png"><title>Classroom Timer · Kathleens Kiste</title>
<style>
:root{--ink:#503d51;--muted:#8d788f;--line:#eadde9;--pink:#efa5c7;--lilac:#b9a6e8;--green:#67a98f;--amber:#d7a05e;--red:#c6677b;--shadow:0 18px 54px rgba(116,76,112,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,"SF Pro Rounded",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,#ffe7f1 0,transparent 27%),radial-gradient(circle at 90% 4%,#ece5ff 0,transparent 27%),linear-gradient(180deg,#fffafd,#fff8fc 52%,#faf8ff)}button,input{font:inherit}button{cursor:pointer}.shell{min-height:100dvh;display:flex;flex-direction:column;max-width:1280px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:12px}.icon{width:55px;height:55px;border-radius:18px;background:linear-gradient(145deg,#f2a5c8,#bba7e8);display:grid;place-items:center;font-size:27px;box-shadow:0 12px 30px rgba(190,121,164,.18)}h1{margin:0;font-size:clamp(28px,4vw,43px);letter-spacing:-.04em;color:#674969}.sub{margin:5px 0 0;font-size:11px;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:850;min-height:42px}.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,#d790b5,#aa8cde)}.btn.danger{color:#a75568;background:#fff7fa}.stage{flex:1;display:grid;place-items:center;padding:22px 0}.timer-card{width:min(900px,100%);background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:30px;padding:26px;box-shadow:var(--shadow);text-align:center;transition:.25s}.timer-card.warn{box-shadow:0 18px 54px rgba(215,160,94,.2)}.timer-card.urgent{box-shadow:0 18px 54px rgba(198,103,123,.25)}.label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:950}.time{font-size:clamp(92px,20vw,220px);line-height:.88;font-weight:1000;letter-spacing:-.07em;color:#654d69;margin:24px 0 20px;font-variant-numeric:tabular-nums}.warn .time{color:#9a6f37}.urgent .time{color:#a95267}.progress{height:12px;border-radius:99px;background:#f2e8ef;overflow:hidden;margin:0 auto 22px;max-width:760px}.bar{height:100%;width:100%;background:linear-gradient(90deg,#d790b5,#aa8cde);transition:width .2s linear,background .2s}.warn .bar{background:#d7a05e}.urgent .bar{background:#c6677b}.presets{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:15px}.preset{border:1px solid var(--line);background:#fffafd;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:900;color:var(--muted)}.preset.active{background:#735a79;color:#fff;border-color:#735a79}.custom{display:flex;gap:7px;justify-content:center;align-items:center;margin-bottom:15px}.custom input{width:82px;border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center;background:#fffafd;font-weight:900}.custom span{font-size:10px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.actions .btn{min-width:112px}.extras{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:11px}.extras .btn{font-size:10px;min-height:38px;padding:8px 10px}.hint{font-size:9px;color:var(--muted);margin-top:14px}.flash{animation:flash .35s ease 6}@keyframes flash{50%{background:#fff0f4;transform:scale(1.008)}}@media(max-width:700px){.shell{padding:12px 10px calc(16px + env(safe-area-inset-bottom))}.top{align-items:flex-start}.brand{gap:9px}.icon{width:43px;height:43px;flex:0 0 43px;border-radius:14px;font-size:21px}h1{font-size:25px}.top>.btn{font-size:10px;padding:9px 10px}.stage{padding:10px 0}.timer-card{padding:18px 11px;border-radius:22px}.time{font-size:clamp(76px,25vw,122px);margin:18px 0}.progress{height:10px;margin-bottom:17px}.presets{gap:5px}.preset{padding:8px 9px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{min-width:0}.actions .primary{grid-column:1/-1}.extras{display:grid;grid-template-columns:repeat(2,1fr)}.custom input{font-size:16px}.hint{display:none}}@media(max-width:700px) and (orientation:landscape){.shell{padding-top:7px}.top{display:none}.stage{padding:0}.timer-card{padding:10px 14px}.time{font-size:30vh;margin:7px 0}.presets,.custom,.hint{display:none}.progress{margin-bottom:9px}.actions .btn,.extras .btn{min-height:36px;padding:6px}.extras{margin-top:6px}}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="icon">⏱</div><div><h1>Classroom Timer</h1><p class="sub">Der schnelle Unterrichtstimer für Arbeitsphasen, Gruppenarbeit und Challenges.</p></div></div><button class="btn" id="backBtn">← Tools</button></header><section class="stage"><div class="timer-card" id="card"><div class="label" id="stateLabel">Bereit</div><div class="time" id="time">05:00</div><div class="progress"><div class="bar" id="bar"></div></div><div class="presets" id="presets"><button class="preset" data-sec="60">1 Min.</button><button class="preset" data-sec="180">3 Min.</button><button class="preset active" data-sec="300">5 Min.</button><button class="preset" data-sec="600">10 Min.</button><button class="preset" data-sec="900">15 Min.</button><button class="preset" data-sec="1200">20 Min.</button></div><div class="custom"><input id="minInput" type="number" min="0" max="180" value="5" inputmode="numeric"><span>Min.</span><input id="secInput" type="number" min="0" max="59" value="0" inputmode="numeric"><span>Sek.</span><button class="btn" id="setBtn">Übernehmen</button></div><div class="actions"><button class="btn primary" id="startBtn">▶ Start</button><button class="btn" id="pauseBtn">Ⅱ Pause</button><button class="btn danger" id="resetBtn">↺ Reset</button></div><div class="extras"><button class="btn" id="plus30">+30 Sek.</button><button class="btn" id="plus60">+1 Min.</button><button class="btn" id="soundBtn">🔔 Ton an</button><button class="btn" id="fullBtn">⛶ Vollbild</button></div><div class="hint">Leertaste: Start/Pause · R: Reset · F: Vollbild</div></div></section></main>
<script>
(()=>{const $=s=>document.querySelector(s);let total=300,remaining=300,running=false,endAt=0,timer=null,sound=true,audioCtx=null;function fmt(sec){sec=Math.max(0,Math.ceil(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function render(){const ratio=total?remaining/total:0;$('#time').textContent=fmt(remaining);$('#bar').style.width=Math.max(0,Math.min(100,ratio*100))+'%';const card=$('#card');card.classList.toggle('warn',ratio<=.2&&ratio>.1&&remaining>0);card.classList.toggle('urgent',ratio<=.1&&remaining>0);$('#stateLabel').textContent=running?'Läuft':remaining<=0?'Zeit ist um':'Bereit';document.title=fmt(remaining)+' · Classroom Timer'}function stopTick(){if(timer){clearInterval(timer);timer=null}}function tick(){remaining=Math.max(0,(endAt-Date.now())/1000);if(remaining<=0){remaining=0;running=false;stopTick();finish()}render()}function start(){if(running||remaining<=0)return;running=true;endAt=Date.now()+remaining*1000;timer=setInterval(tick,200);render()}function pause(){if(!running)return;tick();running=false;stopTick();render()}function reset(){running=false;stopTick();remaining=total;render();$('#card').classList.remove('flash')}function setTime(sec){running=false;stopTick();total=Math.max(1,Math.round(sec));remaining=total;$('#minInput').value=Math.floor(total/60);$('#secInput').value=total%60;document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active',Number(b.dataset.sec)===total));render()}function add(sec){if(running){remaining=Math.max(0,(endAt-Date.now())/1000)+sec;endAt=Date.now()+remaining*1000}else remaining+=sec;total=Math.max(total,remaining);render()}function beep(){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=[660,770,880][i];g.gain.setValueAtTime(.0001,audioCtx.currentTime+d);g.gain.exponentialRampToValueAtTime(.18,audioCtx.currentTime+d+.01);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d+.18);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d+.2)})}catch(e){}}function finish(){beep();const c=$('#card');c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash')}document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>setTime(Number(b.dataset.sec)));$('#setBtn').onclick=()=>setTime(Number($('#minInput').value||0)*60+Number($('#secInput').value||0));$('#startBtn').onclick=start;$('#pauseBtn').onclick=pause;$('#resetBtn').onclick=reset;$('#plus30').onclick=()=>add(30);$('#plus60').onclick=()=>add(60);$('#soundBtn').onclick=()=>{sound=!sound;$('#soundBtn').textContent=sound?'🔔 Ton an':'🔕 Ton aus'};$('#fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};$('#backBtn').onclick=()=>location.href='../../#tools';document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.code==='Space'){e.preventDefault();running?pause():start()}if(e.key.toLowerCase()==='r')reset();if(e.key.toLowerCase()==='f')$('#fullBtn').click()});render();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../../service-worker.js').catch(()=>{}));})();
</script></body></html>
