<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9fc"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="../../manifest.webmanifest"><link rel="apple-touch-icon" href="../../assets/icons/app-180.png"><title>Team Generator · Kathleens Kiste</title>
<style>
:root{--ink:#503d51;--muted:#8d788f;--line:#eadde9;--pink:#efa5c7;--lilac:#b9a6e8;--green:#67a98f;--shadow:0 18px 54px rgba(116,76,112,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,"SF Pro Rounded",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,#ffe7f1 0,transparent 27%),radial-gradient(circle at 90% 4%,#ece5ff 0,transparent 27%),linear-gradient(180deg,#fffafd,#fff8fc 52%,#faf8ff)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1220px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.icon{width:55px;height:55px;border-radius:18px;background:linear-gradient(145deg,#f2a5c8,#bba7e8);display:grid;place-items:center;font-size:27px;box-shadow:0 12px 30px rgba(190,121,164,.18)}h1{margin:0;font-size:clamp(28px,4vw,43px);letter-spacing:-.04em;color:#674969}.sub{margin:5px 0 0;font-size:11px;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:850;min-height:42px}.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,#d790b5,#aa8cde)}.layout{display:grid;grid-template-columns:360px 1fr;gap:14px}.panel{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.panel h2{font-size:15px;margin:0 0 12px}.field{margin-bottom:11px}.field label{display:block;font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}.select,.input{width:100%;border:1px solid var(--line);border-radius:11px;background:#fffafd;padding:10px;color:var(--ink);outline:none}.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#f7f0f5;border-radius:12px;padding:4px}.seg button{border:0;border-radius:9px;padding:9px;background:transparent;color:var(--muted);font-size:10px;font-weight:900}.seg button.active{background:#fff;color:#765675;box-shadow:0 4px 12px rgba(120,75,115,.08)}.hint{font-size:10px;color:var(--muted);line-height:1.45}.teams-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:12px}.teams-head h2{margin:0}.tools{display:flex;gap:6px;flex-wrap:wrap}.teams{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.team{border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px;min-height:150px}.team h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}.team h3 span{font-size:9px;color:var(--muted);font-weight:800}.member{border:1px solid #eee2ec;background:#fffafd;border-radius:10px;padding:8px 9px;font-size:11px;font-weight:800;margin-bottom:6px}.empty{padding:44px 18px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed #dfcede;border-radius:16px}.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:18px;background:rgba(61,44,63,.3);backdrop-filter:blur(6px)}.modal.show{display:grid}.modal-card{width:min(650px,95vw);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 28px 90px rgba(76,50,77,.25)}.modal-card h2{margin:0;font-size:20px}.modal-card p{font-size:11px;color:var(--muted);line-height:1.5}.modal textarea{width:100%;min-height:270px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fffafd;resize:vertical}.modal-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:120;background:#684d72;color:#fff;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:850;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:900px){.teams{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.shell{padding:12px 10px calc(20px + env(safe-area-inset-bottom))}.top{align-items:flex-start}.brand{gap:9px}.icon{width:43px;height:43px;flex:0 0 43px;border-radius:14px;font-size:21px}h1{font-size:25px}.top>.btn{font-size:10px;padding:9px 10px}.layout{grid-template-columns:1fr}.panel{padding:13px;border-radius:17px}.teams{grid-template-columns:1fr}.teams-head{align-items:flex-start;flex-direction:column}.tools{width:100%}.tools .btn{flex:1;font-size:10px}.modal{align-items:end;padding:0}.modal-card{width:100%;max-width:none;border-radius:22px 22px 0 0;padding:17px 14px calc(18px + env(safe-area-inset-bottom))}.modal input,.modal textarea{font-size:16px}}
</style></head><body><main class="shell">
<header class="top"><div class="brand"><div class="icon">🧩</div><div><h1>Team Generator</h1><p class="sub">Mit wenigen Klicks zufällige Gruppen oder Paare erstellen.</p></div></div><div class="row" style="flex:0 0 auto"><button class="btn" id="vaultLockBtn">🔒 Sperren</button><button class="btn" id="backBtn">← Tools</button></div></header>
<div class="layout"><aside class="panel"><h2>Gruppen einstellen</h2><div class="field"><label>Klasse</label><div class="row"><select class="select" id="classSelect"></select><button class="btn" id="editListBtn" style="flex:0 0 auto">Listen</button></div></div>
<div class="field"><label>Aufteilung</label><div class="seg"><button class="active" data-mode="size">Teamgröße</button><button data-mode="count">Anzahl Teams</button></div></div>
<div class="field"><label id="valueLabel">Schüler pro Team</label><select class="select" id="valueSelect"></select></div>
<p class="hint" id="summary">Lege zuerst eine Klassenliste an.</p><button class="btn primary" id="generateBtn" style="width:100%;margin-top:5px">🧩 Teams erstellen</button></aside>
<section class="panel"><div class="teams-head"><h2>Teams</h2><div class="tools"><button class="btn" id="reshuffleBtn">↻ Neu mischen</button><button class="btn" id="copyBtn">Kopieren</button></div></div><div id="teams" class="teams"><div class="empty" style="grid-column:1/-1">Noch keine Teams erstellt.</div></div></section></div></main>
<div class="toast" id="toast"></div><div class="modal" id="listModal"><div class="modal-card"><h2>Klassenlisten</h2><p>Diese Liste wird auch vom Classroom Randomizer verwendet und verschlüsselt auf diesem Gerät gespeichert.</p><div class="field"><label>Klassenname</label><input class="input" id="listName" placeholder="z. B. 9a"></div><div class="field"><label>Schüler – ein Name pro Zeile</label><textarea id="studentText" placeholder="Anna M.&#10;Ben K.&#10;Carla S."></textarea></div><div class="modal-actions"><button class="btn primary" id="saveListBtn">Liste speichern</button><button class="btn" id="newListBtn">Neue Liste</button><button class="btn" id="deleteListBtn">Löschen</button><button class="btn" id="closeListBtn">Schließen</button></div></div></div>
<script src="../classroom-tools-shared.js"></script><script>
(()=>{const $=s=>document.querySelector(s);let mode='size',editingId=null,lastTeams=[];function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}function lists(){return window.KathleenClassLists.load()}function selected(){return window.KathleenClassLists.get($('#classSelect').value)}function esc(s){return String(s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]))}function refreshSelect(prefer){const all=lists(),sel=prefer||$('#classSelect').value;$('#classSelect').innerHTML=all.length?all.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' · '+x.students.length+'</option>').join(''):'<option value="">Keine Klassenliste</option>';if(all.some(x=>x.id===sel))$('#classSelect').value=sel;refreshOptions()}function refreshOptions(){const c=selected();const max=c?.students.length||0;const sel=$('#valueSelect');let vals=[];if(mode==='size'){for(let i=2;i<=Math.min(8,Math.max(2,max));i++)vals.push(i);$('#valueLabel').textContent='Schüler pro Team'}else{for(let i=2;i<=Math.min(12,Math.max(2,max));i++)vals.push(i);$('#valueLabel').textContent='Anzahl Teams'}sel.innerHTML=vals.map(v=>'<option value="'+v+'">'+v+'</option>').join('');$('#generateBtn').disabled=!c||max<2;updateSummary()}function updateSummary(){const c=selected();if(!c){$('#summary').textContent='Lege zuerst eine Klassenliste an.';return}const v=Number($('#valueSelect').value||2),n=c.students.length;let teams=mode==='size'?Math.ceil(n/v):Math.min(v,n);let lo=Math.floor(n/teams),hi=Math.ceil(n/teams);$('#summary').textContent=n+' Schüler → '+teams+' Teams · '+(lo===hi?lo+' pro Team':lo+'–'+hi+' pro Team')}function build(){const c=selected();if(!c||c.students.length<2)return;const shuffled=window.KathleenClassLists.shuffle(c.students),v=Number($('#valueSelect').value||2);let count=mode==='size'?Math.ceil(shuffled.length/v):Math.min(v,shuffled.length);const teams=Array.from({length:count},()=>[]);shuffled.forEach((name,i)=>teams[i%count].push(name));lastTeams=teams;render()}function render(){if(!lastTeams.length){$('#teams').innerHTML='<div class="empty" style="grid-column:1/-1">Noch keine Teams erstellt.</div>';return}$('#teams').innerHTML=lastTeams.map((team,i)=>'<article class="team"><h3>Team '+(i+1)+' <span>'+team.length+' Schüler</span></h3>'+team.map(n=>'<div class="member">'+esc(n)+'</div>').join('')+'</article>').join('')}function openEditor(){const c=selected();editingId=c?.id||null;$('#listName').value=c?.name||'';$('#studentText').value=(c?.students||[]).join('\n');$('#deleteListBtn').disabled=!c;$('#listModal').classList.add('show')}function newEditor(){editingId=null;$('#listName').value='';$('#studentText').value='';$('#deleteListBtn').disabled=true;$('#listName').focus()}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));refreshOptions()});$('#classSelect').onchange=()=>{lastTeams=[];render();refreshOptions()};$('#valueSelect').onchange=updateSummary;$('#generateBtn').onclick=build;$('#reshuffleBtn').onclick=build;$('#copyBtn').onclick=async()=>{if(!lastTeams.length){toast('Noch keine Teams erstellt');return}const text=lastTeams.map((t,i)=>'Team '+(i+1)+': '+t.join(', ')).join('\n');try{await navigator.clipboard.writeText(text);toast('Teams kopiert ✓')}catch(e){toast('Kopieren nicht möglich')}};$('#editListBtn').onclick=openEditor;$('#closeListBtn').onclick=()=>$('#listModal').classList.remove('show');$('#newListBtn').onclick=newEditor;
$('#saveListBtn').onclick=async()=>{try{const item=await window.KathleenClassLists.upsert({id:editingId,name:$('#listName').value,students:$('#studentText').value});editingId=item.id;refreshSelect(item.id);toast('Verschlüsselt gespeichert ✓')}catch(e){toast(e.message)}};
$('#deleteListBtn').onclick=async()=>{if(!editingId||!confirm('Klassenliste wirklich löschen?'))return;await window.KathleenClassLists.remove(editingId);editingId=null;newEditor();refreshSelect();lastTeams=[];render();toast('Liste gelöscht')};
$('#vaultLockBtn').onclick=()=>window.KathleenClassLists.lock(true);$('#backBtn').onclick=()=>location.href='../../#tools';window.addEventListener('kathleen:classlists',()=>refreshSelect());
(async()=>{const ok=await window.KathleenClassLists.requireUnlock();if(ok)refreshSelect()})();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../../service-worker.js').catch(()=>{}));})();;
</script></body></html>
