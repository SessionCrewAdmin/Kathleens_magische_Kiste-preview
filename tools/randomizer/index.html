<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff9fc"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="../../manifest.webmanifest"><link rel="apple-touch-icon" href="../../assets/icons/app-180.png"><title>Classroom Randomizer · Kathleens Kiste</title>
<style>
:root{--ink:#503d51;--muted:#8d788f;--line:#eadde9;--pink:#efa5c7;--lilac:#b9a6e8;--green:#67a98f;--amber:#d7a05e;--shadow:0 18px 54px rgba(116,76,112,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,"SF Pro Rounded",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 0,#ffe7f1 0,transparent 27%),radial-gradient(circle at 90% 4%,#ece5ff 0,transparent 27%),linear-gradient(180deg,#fffafd,#fff8fc 52%,#faf8ff)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.icon{width:55px;height:55px;border-radius:18px;background:linear-gradient(145deg,#f2a5c8,#bba7e8);display:grid;place-items:center;font-size:27px;box-shadow:0 12px 30px rgba(190,121,164,.18)}h1{margin:0;font-size:clamp(28px,4vw,43px);letter-spacing:-.04em;color:#674969}.sub{margin:5px 0 0;font-size:11px;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:850;min-height:42px}.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,#d790b5,#aa8cde)}.btn.ghost{background:rgba(255,255,255,.7)}.layout{display:grid;grid-template-columns:360px 1fr;gap:14px}.panel{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}.panel h2{font-size:15px;margin:0 0 12px}.field{margin-bottom:11px}.field label{display:block;font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}.select,.input{width:100%;border:1px solid var(--line);border-radius:11px;background:#fffafd;padding:10px;color:var(--ink);outline:none}.row{display:flex;gap:7px;align-items:center}.row>*{flex:1}.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fffafd;font-size:11px;font-weight:800}.toggle input{width:20px;height:20px}.pool{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.45}.stage{min-height:480px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:#aa83a0;font-weight:950}.roulette{font-size:clamp(34px,7vw,74px);line-height:1.02;font-weight:1000;letter-spacing:-.04em;color:#694d6e;min-height:86px;display:grid;place-items:center;margin:12px 0}.roulette.spinning{animation:pulse .16s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.035);filter:blur(.2px)}}.results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:100%;max-width:760px;margin:12px auto}.winner{border:1px solid #e9d4e2;background:linear-gradient(135deg,#fff4f9,#f3efff);border-radius:16px;padding:16px 12px;font-weight:950;font-size:19px;box-shadow:0 10px 24px rgba(121,76,116,.08)}.cta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}.history{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;width:100%;max-width:760px}.history h3{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 7px}.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}.chip{font-size:9px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 8px}.empty{color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:18px;background:rgba(61,44,63,.3);backdrop-filter:blur(6px)}.modal.show{display:grid}.modal-card{width:min(650px,95vw);max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 28px 90px rgba(76,50,77,.25)}.modal-card h2{margin:0;font-size:20px}.modal-card p{font-size:11px;color:var(--muted);line-height:1.5}.modal textarea{width:100%;min-height:270px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fffafd;resize:vertical}.modal-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);z-index:120;background:#684d72;color:#fff;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:850;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:760px){.shell{padding:12px 10px calc(20px + env(safe-area-inset-bottom))}.top{align-items:flex-start}.brand{gap:9px}.icon{width:43px;height:43px;flex:0 0 43px;border-radius:14px;font-size:21px}h1{font-size:25px}.top>.btn{min-height:44px;padding:9px 10px;font-size:10px}.layout{grid-template-columns:1fr}.panel{border-radius:17px;padding:13px}.stage{min-height:390px}.roulette{font-size:42px;min-height:70px}.results{grid-template-columns:1fr}.winner{font-size:17px;padding:13px}.modal{align-items:end;padding:0}.modal-card{width:100%;max-width:none;border-radius:22px 22px 0 0;padding:17px 14px calc(18px + env(safe-area-inset-bottom))}.modal input,.modal textarea{font-size:16px}}
</style></head><body><main class="shell">
<header class="top"><div class="brand"><div class="icon">🎲</div><div><h1>Classroom Randomizer</h1><p class="sub">Zufällig auswählen – fair und ohne Wiederholungen.</p></div></div><div class="row" style="flex:0 0 auto"><button class="btn" id="vaultLockBtn">🔒 Sperren</button><button class="btn ghost" id="backBtn">← Tools</button></div></header>
<div class="layout"><aside class="panel"><h2>Auswahl</h2>
<div class="field"><label>Klasse</label><div class="row"><select class="select" id="classSelect"></select><button class="btn" id="editListBtn" style="flex:0 0 auto">Listen</button></div></div>
<div class="field"><label>Wie viele ziehen?</label><select class="select" id="countSelect"><option value="1">1 Schüler</option><option value="2">2 Schüler</option><option value="3">3 Schüler</option><option value="4">4 Schüler</option><option value="5">5 Schüler</option></select></div>
<label class="toggle"><span>Ohne Wiederholungen</span><input type="checkbox" id="noRepeat" checked></label>
<div class="pool" id="poolInfo">Noch keine Klassenliste angelegt.</div>
<div class="cta" style="justify-content:flex-start"><button class="btn" id="resetPoolBtn">↺ Pool zurücksetzen</button></div>
</aside>
<section class="panel stage"><div class="eyebrow">Wer ist dran?</div><div class="roulette" id="roulette">Bereit?</div><div class="results" id="results"></div><div class="cta"><button class="btn primary" id="drawBtn">🎲 Jetzt ziehen</button><button class="btn" id="againBtn">Nochmal</button></div><div class="history"><h3>Heute bereits gezogen</h3><div class="chips" id="history"><span class="empty">Noch niemand.</span></div></div></section></div>
</main><div class="toast" id="toast"></div>
<div class="modal" id="listModal"><div class="modal-card"><h2>Klassenlisten</h2><p>Diese Liste wird auch vom Team Generator verwendet und verschlüsselt auf diesem Gerät gespeichert.</p><div class="field"><label>Klassenname</label><input class="input" id="listName" placeholder="z. B. 9a"></div><div class="field"><label>Schüler – ein Name pro Zeile</label><textarea id="studentText" placeholder="Anna M.&#10;Ben K.&#10;Carla S."></textarea></div><div class="modal-actions"><button class="btn primary" id="saveListBtn">Liste speichern</button><button class="btn" id="newListBtn">Neue Liste</button><button class="btn" id="deleteListBtn">Löschen</button><button class="btn" id="closeListBtn">Schließen</button></div></div></div>
<script src="../classroom-tools-shared.js"></script><script>
(()=>{const $=s=>document.querySelector(s);let editingId=null,drawn=[],spinning=false;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}function lists(){return window.KathleenClassLists.load()}function selected(){return window.KathleenClassLists.get($('#classSelect').value)}function poolKey(){return 'kathleenRandomizerDrawnIndexes:'+(selected()?.id||'none')}function loadDrawn(){try{drawn=JSON.parse(sessionStorage.getItem(poolKey())||'[]');if(!Array.isArray(drawn))drawn=[];drawn=drawn.filter(Number.isInteger)}catch(e){drawn=[]}}function saveDrawn(){sessionStorage.setItem(poolKey(),JSON.stringify(drawn))}function refreshSelect(prefer){const all=lists(),sel=prefer||$('#classSelect').value;$('#classSelect').innerHTML=all.length?all.map(x=>'<option value="'+x.id+'">'+escapeHtml(x.name)+' · '+x.students.length+'</option>').join(''):'<option value="">Keine Klassenliste</option>';if(all.some(x=>x.id===sel))$('#classSelect').value=sel;loadDrawn();renderState()}function renderState(){const c=selected();if(!c){$('#poolInfo').textContent='Noch keine Klassenliste angelegt.';$('#drawBtn').disabled=true;$('#history').innerHTML='<span class="empty">Noch niemand.</span>';return}drawn=drawn.filter(i=>Number.isInteger(i)&&i>=0&&i<c.students.length);const left=c.students.length-drawn.length;$('#poolInfo').textContent=c.students.length+' Schüler · '+($('#noRepeat').checked?left+' noch im Pool':'Wiederholungen erlaubt');$('#drawBtn').disabled=!c.students.length;$('#history').innerHTML=drawn.length?drawn.map(i=>'<span class="chip">'+escapeHtml(c.students[i])+'</span>').join(''):'<span class="empty">Noch niemand.</span>'}function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]))}function openEditor(){const c=selected();editingId=c?.id||null;$('#listName').value=c?.name||'';$('#studentText').value=(c?.students||[]).join('\n');$('#deleteListBtn').disabled=!c;$('#listModal').classList.add('show')}function newEditor(){editingId=null;$('#listName').value='';$('#studentText').value='';$('#deleteListBtn').disabled=true;$('#listName').focus()}async function draw(){if(spinning)return;const c=selected();if(!c||!c.students.length)return;const noRepeat=$('#noRepeat').checked,count=Number($('#countSelect').value),allIdx=c.students.map((_,i)=>i);let available=noRepeat?allIdx.filter(i=>!drawn.includes(i)):allIdx;if(noRepeat&&available.length<count){if(!available.length){toast('Pool ist leer – zuerst zurücksetzen');return}toast('Nur noch '+available.length+' im Pool')}const take=Math.min(count,available.length);spinning=true;$('#results').innerHTML='';$('#drawBtn').disabled=true;$('#roulette').classList.add('spinning');const ticker=setInterval(()=>{$('#roulette').textContent=c.students[Math.floor(Math.random()*c.students.length)]},75);await new Promise(r=>setTimeout(r,1150));clearInterval(ticker);const winnerIdx=window.KathleenClassLists.shuffle(available).slice(0,take),winnerNames=winnerIdx.map(i=>c.students[i]);$('#roulette').classList.remove('spinning');$('#roulette').textContent=winnerNames.length===1?winnerNames[0]:'Ausgewählt!';$('#results').innerHTML=winnerNames.map(n=>'<div class="winner">'+escapeHtml(n)+'</div>').join('');if(noRepeat){drawn=[...drawn,...winnerIdx.filter(i=>!drawn.includes(i))];saveDrawn()}renderState();spinning=false;$('#drawBtn').disabled=false}
$('#classSelect').onchange=()=>{loadDrawn();$('#results').innerHTML='';$('#roulette').textContent='Bereit?';renderState()};$('#noRepeat').onchange=renderState;$('#drawBtn').onclick=draw;$('#againBtn').onclick=draw;$('#resetPoolBtn').onclick=()=>{drawn=[];saveDrawn();renderState();toast('Pool zurückgesetzt')};$('#editListBtn').onclick=openEditor;$('#closeListBtn').onclick=()=>$('#listModal').classList.remove('show');$('#newListBtn').onclick=newEditor;
$('#saveListBtn').onclick=async()=>{try{const item=await window.KathleenClassLists.upsert({id:editingId,name:$('#listName').value,students:$('#studentText').value});editingId=item.id;refreshSelect(item.id);toast('Verschlüsselt gespeichert ✓')}catch(e){toast(e.message)}};
$('#deleteListBtn').onclick=async()=>{if(!editingId||!confirm('Klassenliste wirklich löschen?'))return;await window.KathleenClassLists.remove(editingId);editingId=null;newEditor();refreshSelect();toast('Liste gelöscht')};
$('#vaultLockBtn').onclick=()=>window.KathleenClassLists.lock(true);$('#backBtn').onclick=()=>location.href='../../#tools';window.addEventListener('kathleen:classlists',()=>refreshSelect());
(async()=>{for(let i=sessionStorage.length-1;i>=0;i--){const k=sessionStorage.key(i);if(k&&k.startsWith('kathleenRandomizerDrawn:'))sessionStorage.removeItem(k)}const ok=await window.KathleenClassLists.requireUnlock();if(ok)refreshSelect()})();if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../../service-worker.js').catch(()=>{}));})();;
</script></body></html>
