<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Classroom Board · Kathleens Kiste</title><style>
:root{--ink:#503d51;--muted:#8d788f;--line:#eadde9;--pink:#efa5c7;--lilac:#b9a6e8;--green:#67a98f}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff8fc,#f8f6ff);min-height:100vh}button,input,textarea{font:inherit}.shell{max-width:1500px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:10px;align-items:center}.ico{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,var(--pink),var(--lilac));display:grid;place-items:center;font-size:24px}h1{margin:0;font-size:clamp(26px,4vw,42px)}.sub{font-size:11px;color:var(--muted);margin:3px 0}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:900;cursor:pointer}.btn.primary{border:0;color:#fff;background:linear-gradient(135deg,#d790b5,#aa8cde)}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.board{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.widget{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0;box-shadow:0 14px 40px rgba(100,70,100,.08)}.clock{grid-column:span 4;text-align:center}.task{grid-column:span 8}.timer{grid-column:span 5;text-align:center}.noise{grid-column:span 3;text-align:center}.links{grid-column:span 4}.widget h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}.clockTime{font-size:clamp(54px,9vw,108px);font-weight:1000;letter-spacing:-.06em}.date{font-size:14px;color:var(--muted)}textarea{width:100%;min-height:150px;border:0;outline:0;resize:vertical;background:#fffafd;border-radius:12px;padding:12px;font-size:clamp(18px,2.3vw,32px);font-weight:750;color:var(--ink)}.timerTime{font-size:clamp(60px,10vw,120px);font-weight:1000;letter-spacing:-.06em}.row{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}.preset{min-width:56px}.noiseMeter{height:170px;border-radius:16px;background:#f4eef3;position:relative;overflow:hidden}.noiseFill{position:absolute;left:0;right:0;bottom:0;height:25%;background:linear-gradient(0deg,#67a98f,#d7a05e,#c6677b);transition:.25s}.noiseBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.quick{display:grid;gap:7px}.quick a{text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px;font-weight:900;background:#fffafd}.hint{font-size:10px;color:var(--muted);line-height:1.45}.hidden{display:none!important}@media(max-width:850px){.board{grid-template-columns:1fr}.widget{grid-column:1!important}.top{align-items:flex-start}.clockTime,.timerTime{font-size:70px}}body.k-presenting .shell{max-width:none;padding:22px}body.k-presenting .toolbar,body.k-presenting #backBtn{display:none}body.k-presenting .widget{border-radius:24px}body.k-presenting textarea{min-height:220px}
</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="ico">🖥️</div><div><h1>Classroom Board</h1><p class="sub">Dein zentraler Unterrichtsbildschirm.</p></div></div><button class="btn" id="backBtn">← Tools</button></header><div class="toolbar"><button class="btn" data-toggle="clock">🕒 Uhr</button><button class="btn" data-toggle="task">📝 Arbeitsauftrag</button><button class="btn" data-toggle="timer">⏱ Timer</button><button class="btn" data-toggle="noise">🚦 Arbeitslautstärke</button><button class="btn" data-toggle="links">⚡ Live-Tools</button><button class="btn" id="resetBoard">↺ Board zurücksetzen</button></div><section class="board">
<article class="widget clock" data-widget="clock"><h2>Uhrzeit</h2><div class="clockTime" id="clockTime">--:--</div><div class="date" id="date"></div></article>
<article class="widget task" data-widget="task"><h2>Arbeitsauftrag</h2><textarea id="taskText" placeholder="Arbeitsauftrag hier eingeben …"></textarea><p class="hint">Bleibt nur auf diesem Gerät und wird nicht hochgeladen.</p></article>
<article class="widget timer" data-widget="timer"><h2>Timer</h2><div class="timerTime" id="timerTime">05:00</div><div class="row"><button class="btn preset" data-sec="60">1m</button><button class="btn preset" data-sec="180">3m</button><button class="btn preset" data-sec="300">5m</button><button class="btn preset" data-sec="600">10m</button><button class="btn primary" id="timerStart">▶ Start</button><button class="btn" id="timerReset">↺</button></div></article>
<article class="widget noise" data-widget="noise"><h2>Arbeitslautstärke</h2><div class="noiseMeter"><div class="noiseFill" id="noiseFill"></div></div><div class="noiseBtns"><button class="btn" data-noise="20">Leise</button><button class="btn" data-noise="55">Okay</button><button class="btn" data-noise="90">Zu laut</button></div><p class="hint">Manuelle Ampel – kein Mikrofonzugriff.</p></article>
<article class="widget links" data-widget="links"><h2>Live mitmachen</h2><div class="quick"><a href="../interactive-board/">💬 Interactive Board</a><a href="../live-poll/">📊 Live Poll</a><a href="../randomizer/">🎲 Randomizer</a><a href="../team-generator/">🧩 Team Generator</a></div></article>
</section></main><script src="../presentation-mode.js"></script><script>
(()=>{const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];function clock(){const d=new Date();$('#clockTime').textContent=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});$('#date').textContent=d.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long'})}clock();setInterval(clock,1000);$('#taskText').value=localStorage.getItem('kathleenBoardTask')||'';$('#taskText').addEventListener('input',()=>localStorage.setItem('kathleenBoardTask',$('#taskText').value));$$('[data-toggle]').forEach(b=>b.onclick=()=>document.querySelector('[data-widget="'+b.dataset.toggle+'"]').classList.toggle('hidden'));$$('[data-noise]').forEach(b=>b.onclick=()=>$('#noiseFill').style.height=b.dataset.noise+'%');let total=300,left=300,end=0,tick=null;const render=()=>$('#timerTime').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(Math.ceil(left%60)).padStart(2,'0');function stop(){clearInterval(tick);tick=null}function start(){if(tick||left<=0)return;end=Date.now()+left*1000;tick=setInterval(()=>{left=Math.max(0,(end-Date.now())/1000);render();if(left<=0)stop()},200)}$$('[data-sec]').forEach(b=>b.onclick=()=>{stop();total=left=Number(b.dataset.sec);render()});$('#timerStart').onclick=start;$('#timerReset').onclick=()=>{stop();left=total;render()};$('#resetBoard').onclick=()=>{if(confirm('Board zurücksetzen?')){localStorage.removeItem('kathleenBoardTask');location.reload()}};$('#backBtn').onclick=()=>location.href='../../#tools';render()})();
</script></body></html>
